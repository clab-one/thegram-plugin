name: Validate cloud plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test package discovery and preservation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check shell syntax
        run: sh -n scripts/chatgpt-package.sh tests/offline/run.sh
      - name: Verify pinned shared workflow
        run: python3 scripts/sync_skill.py --check
      - name: Build and validate native host releases
        run: |
          version=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          for host in chatgpt claude; do
            archive="$RUNNER_TEMP/thegram-$host-$version.zip"
            python3 scripts/package_plugin.py build --host "$host" --output "$archive" --expected-version "$version"
            python3 scripts/package_plugin.py validate "$archive" --host "$host" --expected-version "$version"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: thegram-native-host-packages
          path: ${{ runner.temp }}/thegram-*.zip
          if-no-files-found: error
